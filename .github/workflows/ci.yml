name: Validate CardPilot
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cardpilot
          POSTGRES_PASSWORD: localonly
          POSTGRES_DB: cardpilot
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run migrate
        env:
          DATABASE_URL: postgres://cardpilot:localonly@localhost:5432/cardpilot
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://cardpilot:localonly@localhost:5432/cardpilot
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd ios && xcodegen generate
      - run: xcodebuild -project ios/CardPilot.xcodeproj -scheme CardPilot -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
