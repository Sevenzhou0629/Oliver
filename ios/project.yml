name: CardPilot
options:
  bundleIdPrefix: com.cardpilot
  deploymentTarget:
    iOS: '17.0'
packages:
  LinkKit:
    url: https://github.com/plaid/plaid-link-ios-spm.git
    exactVersion: 7.3.1
targets:
  CardPilot:
    type: application
    platform: iOS
    sources: [CardPilot]
    dependencies:
      - package: LinkKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cardpilot.demo
        SWIFT_VERSION: '5.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: NO
